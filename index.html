<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ThinkiX | Management Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #07111f;
        color: white;
        overflow: hidden;
      }

      /* Background glow */
      body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: #00c8ff;
        filter: blur(180px);
        opacity: 0.15;
        top: -150px;
        left: -150px;
      }

      body::after {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: #2563eb;
        filter: blur(180px);
        opacity: 0.15;
        bottom: -150px;
        right: -150px;
      }

      .login-container {
        width: 420px;
        padding: 45px;
        background: rgba(15, 30, 50, 0.92);
        border: 1px solid rgba(0, 200, 255, 0.25);
        border-radius: 18px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        position: relative;
        z-index: 1;
      }

      .logo {
        width: 65px;
        height: 65px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #00c8ff, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: bold;
      }

      h1 {
        text-align: center;
        font-size: 27px;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #91a4bb;
        font-size: 14px;
        margin-bottom: 32px;
      }

      .management-badge {
        width: fit-content;
        margin: 0 auto 25px;
        padding: 7px 14px;
        border-radius: 20px;
        background: rgba(0, 200, 255, 0.1);
        border: 1px solid rgba(0, 200, 255, 0.25);
        color: #54d9ff;
        font-size: 12px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #c8d5e5;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border-radius: 9px;
        border: 1px solid #31445c;
        background: #091525;
        color: white;
        outline: none;
        font-size: 14px;
      }

      input:focus {
        border-color: #00c8ff;
        box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.08);
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(90deg, #00bce8, #2563eb);
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 174, 255, 0.25);
      }

      .footer-text {
        text-align: center;
        margin-top: 25px;
        color: #667b94;
        font-size: 12px;
      }

      .status {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 16px;
        color: #6f849b;
        font-size: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="logo">IX</div>

      <h1>ThinkiX Management</h1>

      <p class="subtitle">Secure Industrial IoT Management Portal</p>

      <div class="management-badge">🔒 AUTHORIZED MANAGEMENT ACCESS</div>

      <form id="loginForm">
        <label for="email"> Management Email </label>

        <input
          type="email"
          id="email"
          placeholder="Enter management email"
          required
        />

        <label for="password"> Password </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        />

        <button type="submit">Secure Login →</button>
      </form>

      <div class="status">
        <span class="dot"></span>
        ThinkiX Secure Gateway Online
      </div>

      <p class="footer-text">ThinkiX Manufacturing • Industrial IoT Security</p>
    </div>

    <!-- LOGIN CONNECTION TO LIVE RENDER BACKEND -->

    <script>
      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value;

        const password = document.getElementById("password").value;

        try {
          // LIVE RENDER BACKEND
          const response = await fetch(
            "https://bn304-backend.onrender.com/login",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                email: email,
                password: password,
              }),
            },
          );

          const result = await response.json();

          // LOGIN SUCCESSFUL
          if (response.ok && result.success) {
            window.location.href = "management.html";
          }

          // WRONG EMAIL OR PASSWORD
          else {
            alert(result.message || "Invalid email or password");
          }
        } catch (error) {
          console.error("Login error:", error);

          alert("Cannot connect to the ThinkiX backend. Please try again.");
        }
      });
    </script>
  </body>
</html>
